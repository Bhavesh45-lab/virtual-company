<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Company HQ</title>
<style>
:root{
  --wall:#c9cfdc;
  --bg:#f4f5f8; --panel:#ffffff; --ink:#1b1f2a; --muted:#667085; --line:#e3e6ee; --floor:#eceef4;
  --accent:#008f78; --accent-fill:#00E5C0; --accent-soft:#d9faf4; --ok:#2f9e44; --warn:#e08a00; --bad:#d6336c;
  --side:#0A0E1F; --side-ink:#c9cede; --radius:12px;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0A0E1F; --panel:#101830; --ink:#e9ebf2; --muted:#98a0b5; --line:#1E284A; --floor:#0d1428;
         --accent:#00E5C0; --accent-soft:#0f3a3a; --side:#070a17; --wall:#2e3a62; }
}
*{box-sizing:border-box}
body{margin:0;font:15px/1.55 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink);display:flex;min-height:100vh}
aside{width:226px;background:var(--side);color:var(--side-ink);padding:18px 12px;flex-shrink:0;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{color:#fff;font-weight:700;font-size:17px}
.brand-sub{font-size:12px;padding:0 10px 8px;opacity:.7}
.nav-group{font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.5;padding:14px 10px 4px}
nav button{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;background:none;border:0;color:inherit;font:inherit;padding:8px 10px;border-radius:8px;cursor:pointer}
nav button:hover{background:#ffffff14}
nav button.on{background:var(--accent-fill);color:#0A0E1F;font-weight:600}
.logo{display:flex;align-items:center;gap:8px;padding:0 6px}
.logo svg{width:44px;height:44px;flex-shrink:0}
.badge{background:var(--bad);color:#fff;border-radius:10px;padding:0 7px;font-size:12px;font-weight:600}
nav button.on .badge{background:#0A0E1F}
.side-foot{margin-top:auto;font-size:12px;opacity:.7;padding:10px}
main{flex:1;padding:24px 28px 60px;min-width:0;max-width:1480px}
h1{font-size:23px;margin:0 0 4px} h2{font-size:17px;margin:0 0 10px} h3{font-size:15px;margin:0 0 6px}
.sub{color:var(--muted);margin:0 0 18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:16px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.muted{color:var(--muted)} .small{font-size:13px}
.pill{display:inline-block;border-radius:20px;padding:2px 10px;font-size:12px;font-weight:600;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.pill.approved{background:#2f9e4422;color:var(--ok)} .pill.hold{background:#e08a0022;color:var(--warn)} .pill.rejected{background:#d6336c22;color:var(--bad)}
.avatar{width:42px;height:42px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0}
.avatar.sm{width:30px;height:30px;font-size:10px}
.row{display:flex;gap:12px;align-items:center}
.bar{height:7px;background:var(--line);border-radius:4px;overflow:hidden;flex:1}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.score-row{display:flex;align-items:center;gap:10px;font-size:13px;margin:5px 0}
.score-row span:first-child{width:160px;color:var(--muted)} .score-row b{width:22px;text-align:right}
.idea-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.rank{font-size:13px;font-weight:700;color:var(--accent)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:12px 0}
.fact{background:var(--bg);border-radius:8px;padding:9px 11px;font-size:13px}
.fact b{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-bottom:2px}
.view{border-left:3px solid var(--line);padding:2px 0 2px 12px;margin:10px 0}
.view b{font-size:13px}
details summary{cursor:pointer;font-weight:600;color:var(--accent);margin-top:8px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
button.btn{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:7px 14px;border-radius:8px;cursor:pointer;white-space:nowrap}
button.btn:hover{border-color:var(--accent)}
button.btn.primary{background:var(--accent-fill);border-color:var(--accent-fill);color:#0A0E1F;font-weight:600}
a{color:var(--accent)}
button.btn.sel-approved{background:var(--ok);border-color:var(--ok);color:#fff}
button.btn.sel-hold{background:var(--warn);border-color:var(--warn);color:#fff}
button.btn.sel-rejected{background:var(--bad);border-color:var(--bad);color:#fff}
.fld{display:flex;flex-direction:column;gap:3px;font-size:13px;margin-bottom:12px}
.fld>span:first-child{font-weight:600}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:0 12px}
input[type=color]{width:100%;height:38px;padding:2px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
input[type=text],input[type=number],textarea,select{font:inherit;width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
textarea{min-height:70px;resize:vertical}
table{width:100%;border-collapse:collapse;font-size:14px} th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top} th{font-size:12px;color:var(--muted);text-transform:uppercase}
td.num{text-align:center;font-variant-numeric:tabular-nums}
.log{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)} .log:last-child{border:0}
.roadmap{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:8px}
.roadmap ul{margin:4px 0 0;padding-left:18px;font-size:13px}
.toast{position:fixed;bottom:20px;right:20px;background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50}
.toast.show{opacity:1}
.memo p{margin:0 0 10px}
.live-dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--bad);margin-right:6px;animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
@keyframes blink{0%,45%{opacity:1}55%,100%{opacity:0}}
@keyframes glow{0%,100%{box-shadow:0 0 0 2px var(--c,var(--accent-fill))}50%{box-shadow:0 0 0 7px transparent}}
.talk{stroke-dasharray:5 11;stroke-linecap:round;animation:dash 1.5s linear infinite}
@keyframes dash{to{stroke-dashoffset:-16}}
.feed{max-height:430px;overflow-y:auto;display:flex;flex-direction:column;gap:10px}
.msg{display:flex;gap:9px;align-items:flex-start}
.msg .avatar{width:32px;height:32px;font-size:11px}
.bubble{background:var(--bg);border-radius:10px;padding:7px 11px;font-size:14px;flex:1;min-width:0;overflow-wrap:anywhere}
.bubble .who{font-size:12px;color:var(--muted);margin-bottom:2px}
.msg.new .bubble{outline:2px solid var(--accent-fill)}
.msg.me{flex-direction:row-reverse} .msg.me .bubble{background:var(--accent-soft)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:20px;padding:4px 12px;cursor:pointer}
.chip.cur{background:var(--accent-fill);border-color:var(--accent-fill);color:#0A0E1F;font-weight:600}
.chip.past{opacity:.6}

/* Office */
.mrooms{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-bottom:16px}
.mroom{font:inherit;color:var(--ink);text-align:left;background:linear-gradient(135deg,color-mix(in srgb,#cfe6ff 25%,var(--panel)),var(--panel));border:2px solid #9fb7d6;border-radius:8px;padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;gap:5px;min-height:92px;box-shadow:inset 0 0 0 3px color-mix(in srgb,#ffffff 40%,transparent)}
.mini-room{position:relative;height:74px;margin:2px 0}
.mini-table{position:absolute;left:22%;top:24%;width:56%;height:52%;border-radius:50%;background:linear-gradient(#c79a68,#a77847);border:3px solid #7a5530;display:flex;align-items:center;justify-content:center}
.chair{position:absolute;width:13px;height:13px;margin:-6.5px 0 0 -6.5px;border-radius:50%;background:var(--line);border:2px solid var(--panel)}
.chair.taken{border-color:#fff;box-shadow:0 0 0 1px #0003}
.mroom:hover{border-color:var(--accent)} .mroom.busy{border:2px solid var(--bad);box-shadow:0 0 0 3px #d6336c22}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-size:13px;color:var(--muted)}
.stat b{font-size:17px;color:var(--ink);margin-right:6px}
button.stat{font:inherit;font-size:13px;cursor:pointer} button.stat:hover{border-color:var(--accent)}
.office{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:16px;align-items:start}
.floor{position:relative;background:var(--floor);border:1px solid var(--line);border-radius:16px;padding:16px;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:32px 32px}
#wires{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}
.exec{display:flex;justify-content:center;gap:16px;margin-bottom:16px;flex-wrap:wrap}
.reception{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:linear-gradient(90deg,#0A0E1F,#1b2550);color:#e9ebf2;border-radius:10px;padding:8px 14px;margin-bottom:14px;font-weight:600;font-size:13px;box-shadow:0 2px 0 #00E5C055}
.reception .small{opacity:.75;font-weight:400}
.rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.room{position:relative;background:color-mix(in srgb,var(--c) 6%,var(--panel));border:3px solid var(--wall);border-radius:6px;padding:10px 12px 18px;transition:box-shadow .3s;
  background-image:radial-gradient(color-mix(in srgb,var(--c) 14%,transparent) 1px,transparent 1.4px);background-size:9px 9px}
.room .door{position:absolute;bottom:-3px;left:50%;width:46px;height:3px;margin-left:-23px;background:var(--floor)}
.room .door::after{content:"";position:absolute;left:0;bottom:3px;width:22px;height:22px;border:2px solid var(--wall);border-width:0 0 0 2px;border-radius:0 22px 0 0;opacity:.6}
.room .plant{position:absolute;right:6px;bottom:2px;font-size:15px;opacity:.85}
.zone-dot{display:inline-block;width:9px;height:9px;border-radius:2px;background:var(--c);margin-right:6px}
.room.busy{box-shadow:0 0 0 2px var(--c)}
.room-name{font-weight:700;font-size:13px;display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.room-tag{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:8px 0 4px}
.desks{display:flex;flex-wrap:wrap;gap:8px}
.desk{position:relative;font:inherit;color:var(--ink);background:none;border:0;border-radius:8px;padding:2px 4px 6px;width:104px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;text-align:center;opacity:.6;transition:opacity .3s,transform .2s}
.ws-monitor{width:30px;height:19px;background:#2b3248;border:2px solid #1a1f30;border-radius:3px;position:relative;z-index:1;transition:background .4s,box-shadow .4s}
.ws-monitor::after{content:"";position:absolute;left:50%;bottom:-6px;width:6px;height:4px;margin-left:-3px;background:#1a1f30}
.ws-monitor.on{background:linear-gradient(135deg,#00E5C0,#1971c2);box-shadow:0 0 10px #00E5C088}
.ws-top{width:78px;height:13px;margin-top:3px;border-radius:4px;background:linear-gradient(#c79a68,#a77847);box-shadow:0 2px 0 #7a5530}
.seat-wrap{position:relative;padding-bottom:5px}
.seat-wrap::after{content:"";position:absolute;left:50%;bottom:0;width:26px;height:6px;margin-left:-13px;border-radius:0 0 8px 8px;background:#4a5068}
.desk.ws:hover .ws-top{box-shadow:0 2px 0 #7a5530,0 0 0 2px var(--accent-fill)}
.plate{font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;font-weight:700}
.mini-ws{display:flex;flex-direction:column;align-items:center;margin-left:auto}
.mini-ws .ws-top{width:44px}
.desk:hover{border-color:var(--accent);opacity:1;transform:translateY(-2px)}
.desk.cabin{width:100%;flex-direction:column;align-items:stretch;text-align:left;gap:0;padding:8px 10px;border:2px solid color-mix(in srgb,var(--c) 55%,#9fb7d6);border-radius:6px;
  background:linear-gradient(135deg,color-mix(in srgb,#cfe6ff 22%,var(--panel)),var(--panel));box-shadow:inset 0 0 0 3px color-mix(in srgb,#ffffff 35%,transparent)}
.desk.exec-cabin{width:230px}
.desk.idle,.desk.in,.desk.speak{opacity:1}
.desk.ws.in .seat-wrap .avatar{box-shadow:0 0 0 3px var(--c)}
.desk.ws.speak .seat-wrap .avatar{box-shadow:0 0 0 4px var(--c)}
.desk.cabin.in{border-color:var(--c)}
.desk.cabin.speak{box-shadow:0 0 0 3px var(--c)}
.desk.speak .avatar{animation:glow 1.8s ease-in-out infinite}
.desk-name{font-size:11.5px;line-height:1.25;font-weight:600}
.desk.cabin .desk-name{font-size:13px}
.desk-state{font-size:10.5px;color:var(--muted);font-weight:400;margin-top:2px}
.chip .live-dot{margin-right:5px}
.say{position:absolute;left:50%;bottom:calc(100% + 8px);transform:translateX(-50%);width:230px;background:var(--ink);color:var(--bg);font-size:12px;line-height:1.35;font-weight:400;text-align:left;padding:7px 10px;border-radius:10px;z-index:5;pointer-events:none}
.say::after{content:"";position:absolute;top:100%;left:50%;margin-left:-6px;border:6px solid transparent;border-top-color:var(--ink)}
.now{position:sticky;top:16px}
.cams{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;align-content:start}
.cam{font:inherit;color:var(--ink);text-align:left;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:10px;padding:10px;cursor:pointer;display:flex;flex-direction:column;gap:5px}
.cam:hover,.cam.on{border-color:var(--c);box-shadow:0 0 0 2px var(--c)}
.cam-now{font-size:13px;min-height:36px}
.cam-nums{display:flex;gap:10px;font-size:12px;color:var(--muted)} .cam-nums b{color:var(--ink)}
.dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.roomwin{position:fixed;inset:3vh 3vw;background:var(--bg);border:1px solid var(--line);border-radius:16px;z-index:21;padding:20px 22px;overflow-y:auto}
.roomgrid{display:grid;grid-template-columns:minmax(0,3fr) minmax(300px,2fr);gap:16px;align-items:start}
.tv{background:#0b1020;color:#d7dcf0;border:8px solid #1a2140;border-radius:14px;padding:14px 18px;min-height:210px;box-shadow:0 6px 0 #05070f}
.tv-top{display:flex;justify-content:space-between;align-items:center;font-size:11px;letter-spacing:.08em;color:#8892b8}
.tv-body{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start} .tv-body ul{margin:0;padding-left:20px;flex:1;min-width:200px;font-size:15px;line-height:1.7}
.tv-note{font-size:12px;color:#8892b8;margin-top:4px}
.tvbtn{font:inherit;width:26px;height:24px;margin-left:4px;border:1px solid #3b4770;border-radius:6px;background:none;color:#d7dcf0;cursor:pointer}
.hall{position:relative;height:330px;margin-top:16px;background:var(--floor);border:1px solid var(--line);border-radius:16px}
.table{position:absolute;left:24%;top:27%;width:52%;height:46%;border-radius:50%/50%;background:linear-gradient(#b98a5a,#8d6238);border:5px solid #6f4b29;color:#fff;display:flex;align-items:center;justify-content:center;text-align:center;padding:10px;font-size:14px;box-shadow:0 8px 14px #0003}
.seat{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;width:110px;text-align:center}
.seat .avatar{border:3px solid var(--panel)} .seat.talking .avatar{animation:glow 1.8s ease-in-out infinite}
.seat-name{font-size:12.5px;font-weight:700;line-height:1.2;margin-top:2px} .seat-role{font-size:10px;color:var(--muted);line-height:1.15}
.seat.empty{opacity:.5}
.seat:hover .avatar{transform:scale(1.08)} .seat.pinned .avatar{box-shadow:0 0 0 4px #FFB020}
.seat .pin{position:absolute;top:-14px;right:22px;font-size:16px}
.caret{display:inline-block;margin-left:2px;color:var(--accent);animation:blink 1.1s step-end infinite}
.whiteboard{background:repeating-linear-gradient(var(--panel),var(--panel) 27px,var(--line) 28px)}
.celebrate{position:fixed;inset:0;z-index:40;pointer-events:none;display:flex;align-items:flex-start;justify-content:center}
.celebrate span{position:absolute;top:-40px;font-size:30px;animation:fall 3.2s linear infinite}
@keyframes fall{to{transform:translateY(105vh) rotate(360deg)}}
.celebrate-card{margin-top:12vh;background:var(--panel);border:2px solid var(--accent-fill);border-radius:16px;padding:18px 28px;text-align:center;max-width:520px;box-shadow:0 10px 40px #0005}
@media (max-width:900px){.roomgrid{grid-template-columns:1fr}.roomwin{inset:0;border-radius:0}}
.monitors{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}
.monitor{cursor:pointer;display:flex;flex-direction:column}
.monitor .screen{background:#151b30;border:7px solid #23293d;border-bottom-width:12px;border-radius:10px;height:150px;overflow:hidden;color:#d7dcf0;font-size:12.5px;box-shadow:0 0 0 1px var(--line)}
.monitor.big{cursor:default} .monitor.big .screen{height:auto;min-height:340px;max-height:66vh;overflow:auto}
.monitor:hover .screen{box-shadow:0 0 0 2px var(--c)}
.monitor .stand{width:34%;height:9px;margin:0 auto;background:#2b3248;border-radius:0 0 8px 8px}
.app-bar{display:flex;gap:6px;align-items:center;background:#23293d;padding:4px 8px;font-size:11px}
.app-bar .url{background:#151b30;border-radius:6px;padding:1px 8px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#aeb6d0}
.app-body{padding:8px 10px;line-height:1.4} .app-body.doc{margin:0;white-space:pre-wrap;font:11.5px/1.45 Consolas,monospace;color:#cfd6ee}
.monitor.big .app-body.doc{font-size:13px}
.wallpaper{height:100%;min-height:120px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;padding:10px;background:radial-gradient(circle at 30% 20%,#25305a,#10152a)}
/* motion */
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:translate(-50%,6px) scale(.9)}100%{opacity:1;transform:translate(-50%,0) scale(1)}}
@keyframes bubble{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
@keyframes screen{to{background-position:0 -40px}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
#main.enter > *{animation:rise .45s cubic-bezier(.2,.7,.2,1) both}
#main.enter > *:nth-child(2){animation-delay:.04s} #main.enter > *:nth-child(3){animation-delay:.08s}
#main.enter > *:nth-child(4){animation-delay:.12s} #main.enter > *:nth-child(5){animation-delay:.16s} #main.enter > *:nth-child(n+6){animation-delay:.2s}
.say{animation:pop .28s ease-out both}
.msg.new{animation:bubble .35s ease-out both}
.ws-monitor.on{overflow:hidden}
.ws-monitor.on::before{content:"";position:absolute;inset:2px;background:repeating-linear-gradient(#ffffffaa 0 1px,transparent 1px 4px);opacity:.55;animation:screen 1.6s linear infinite}
.desk.speak .seat-wrap .avatar,.desk.cabin.speak .seat-wrap .avatar{animation:bob 2.2s ease-in-out infinite,glow 1.8s ease-in-out infinite}
.mroom.busy .mini-table{box-shadow:0 0 0 4px #d6336c33;animation:pulse 2.4s ease-in-out infinite}
.desk,.mroom,.monitor,.cam,.card{transition:transform .2s ease,box-shadow .25s ease,opacity .3s}
.mroom:hover,.monitor:hover,.cam:hover{transform:translateY(-2px)}
#walkers{position:fixed;inset:0;pointer-events:none;z-index:30}
.walker{position:fixed;width:30px;height:30px;font-size:10px;box-shadow:0 6px 14px #0005;border:2px solid #fff}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
/* Mail */
.mail{display:grid;grid-template-columns:290px minmax(0,1fr);gap:0;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;min-height:70vh}
.folders{border-right:1px solid var(--line);padding:10px;overflow-y:auto;max-height:82vh}
.folder{display:flex;gap:9px;align-items:center;width:100%;text-align:left;font:inherit;color:var(--ink);background:none;border:0;border-radius:8px;padding:7px 8px;cursor:pointer}

    const sideWas = EVENTS.length+"/"+(EVENTS.length ? EVENTS[EVENTS.length-1].time : "")+"/"+JSON.stringify(DELIV).length;
    EVENTS = d.events || EVENTS; MEM = d.memory || MEM; DELIV = d.deliverables || DELIV; ROOMS = d.rooms || ROOMS;
    const stage = EVENTS.filter(e => e.kind === "milestone").pop();
    if (stage && stage.time > CELEB.last){ CELEB.last = stage.time; CELEB.text = stage.text; setTimeout(() => { CELEB.text = ""; render(); }, 9000); }
    const typedChanged = typedWas !== JSON.stringify(TYPING);
    const restChanged = sideWas !== EVENTS.length+"/"+(EVENTS.length ? EVENTS[EVENTS.length-1].time : "")+"/"+JSON.stringify(DELIV).length || filesWas !== FILES.length || engineWas !== ENGINE || liveWas !== JSON.stringify(LIVE) || JSON.stringify(d.meeting) !== JSON.stringify(M) || JSON.stringify(d.comms).length !== JSON.stringify(C).length;

    const active = document.activeElement, boxId = active && ["chatInput","roomInput"].includes(active.id) ? active.id : "", at = boxId ? active.selectionStart : 0;

function officeThreads(){

function tick(){
  if ((tab !== "office" && tab !== "campus") || P.paused || profileId || OFFICE.busy) return;
  const typingNow = document.activeElement && ["chatInput","roomInput"].includes(document.activeElement.id);
  if (typingNow && (OFFICE.say || CHAT.draft)) return;   // do not redraw under the founder's hands
  if (MV.listening) return;
  const ts = officeThreads(); if (!ts.length) return;
  const t = ts.find(x => x.id === P.tid);
  if (!t){ P.tid = (OFFICE.mode === "live" ? ts[ts.length-1] : ts[0]).id; P.idx = 0; P.done = false; }
  else if (MV.mode === "voice" && ROOMV.open && t.room){ meetVoiceStep(); return; }   // in voice mode the voices set the pace
  else if (P.idx <= t.messages.length) P.idx++;
  else if (t.status === "live") return;   // the meeting goes on: wait for the next people to speak
  else { const i = ts.indexOf(t);
    if (i < ts.length-1){ P.tid = ts[i+1].id; P.idx = 0; P.done = false; }
    else if (P.done) return;          // waiting for the next activity
    else P.done = true; }
  render();
}

const VOICE = {on:false, id:"", lang:"en-IN", rec:null, state:"", heard:""};

  const wanted = female ? /heera|neerja|swara|zira|aria|jenny|sonia|female|woman/i : /ravi|prabhat|david|mark|guy|ryan|male/i;
  const voice = english.find(v => wanted.test(v.name) && !(female ? false : /female/i.test(v.name))) || english[0];

    stopVoice(); toast(e.error === "not-allowed" || e.error === "service-not-allowed" ? "Allow the microphone for this page, then start voice again." : "Voice stopped: "+e.error); };
  rec.onend = () => { VOICE.rec = null; if (!VOICE.on) return;

// The words an employee has written so far, without the command lines meant for the server.
function typedText(id){
  return (TYPING[id] || "").split("\n")
    .filter(x => !/^\W*(PROPOSAL|READ|RELAY|TELL|BOOK ROOM|NEW PROJECT|SET ROLE|DELIVERABLE|DOCUMENT|END DOCUMENT)\b/i.test(x)).join("\n");
}
// While someone is writing, only their words change. Rebuilding the whole page for that would
// restart every animation on it, so the text is written straight into the bubble instead.
function renderTyping(){
  const box = document.getElementById("typingNow");
  if (!box) return false;
  const id = box.getAttribute("data-for");
  if (!TYPING[id]) return false;
  const text = typedText(id);
  if (box.textContent !== text){
    box.textContent = text;
    const feed = document.getElementById("chat");
    if (feed && feed.scrollHeight - feed.scrollTop - feed.clientHeight < 80) feed.scrollTop = feed.scrollHeight;
  }
  return true;
}

  if (fresh){ render.last = tab; main.classList.remove("enter"); void main.offsetWidth; main.classList.add("enter");
    clearTimeout(render.enterT); render.enterT = setTimeout(() => main.classList.remove("enter"), 800); }   // only the first paint of a page slides in

  // animation on it two or three times a second, which is what made the movement jump.
